        <script id="console-capture">
            // Keep the last console errors and warnings for "Report a Bug"
            (function () {
                const log = window.hrfConsoleLog = window.hrfConsoleLog || [];
                let last = null, repeats = 0, time = "";
                const add = (kind, parts) => {
                    const text = parts.map(p => (p instanceof Error) ? (p.stack || p.message) : (typeof p === "object") ? (() => { try { return JSON.stringify(p) } catch (e) { return String(p) } })() : String(p)).join(" ");
                    const line = kind + " " + text.replace(/\x1b\[[0-9;]*m/g, "").substring(0, 2000);
                    // collapse repeats, like the missing card images
                    if (line === last) {
                        repeats += 1;
                        log[log.length - 1] = time + " " + line + " (" + repeats + " times)";
                        return;
                    }
                    last = line;
                    repeats = 1;
                    time = new Date().toISOString().substring(11, 19);
                    log.push(time + " " + line);
                    if (log.length > 100)
                        log.shift();
                };
                ["error", "warn"].forEach(kind => {
                    const original = console[kind];
                    console[kind] = function () {
                        add(kind, Array.prototype.slice.call(arguments));
                        return original.apply(console, arguments);
                    };
                });
                window.addEventListener("error", e => add("uncaught", [e.error || (e.message + " at " + e.filename + ":" + e.lineno)]));
                window.addEventListener("unhandledrejection", e => add("unhandled", [e.reason]));
            })();
        </script>

        <script id="switch-fullscreen-on-triple-click">
            let switchFullScreen = function () {
                try {
                    if (document.fullscreenElement) {
                        document.getElementById("force-allow-scroll").style.display = "";
                        document.exitFullscreen();
                    }
                    else {
                        document.getElementById("force-allow-scroll").style.display = "none";
                        document.documentElement.requestFullscreen();
                    }
                } catch (error) {
                    console.log("switch fullscreen error");
                    console.error(error);
                }
            }

            let lastClick = 0;
            let lastX = 0;
            let lastY = 0;
            let count = 0;

            window.clicksToSwitchFullScreen = 3;

            window.onmousedown = function (e) {
                if (Date.now() - lastClick < 400 && Math.abs(e.screenX - lastX) < 30 && Math.abs(e.screenY - lastY) < 30)
                    count += 1;
                else
                    count = 1;

                lastClick = Date.now();
                lastX = e.screenX;
                lastY = e.screenY;

                if (window.clicksToSwitchFullScreen == 0 && document.fullscreenElement)
                    return;

                if (count >= window.clicksToSwitchFullScreen) {
                    lastClick = 0;
                    count = 0;
                    switchFullScreen();
                }
            };
        </script>
